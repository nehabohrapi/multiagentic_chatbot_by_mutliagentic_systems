  <script>
    function downloadSVG() {
      const svg = document.querySelector("#architecture-svg");
      const svgData = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "nexus_current_architecture_workflow.svg";
      link.click();
      URL.revokeObjectURL(url);
    }

    function downloadPNG() {
      const svg = document.querySelector("#architecture-svg");
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const img = new Image();
      
      const scale = 2.5; // High resolution rendering
      canvas.width = 1280 * scale;
      canvas.height = 1520 * scale;

      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const URLObj = window.URL || window.webkitURL || window;
      const blobURL = URLObj.createObjectURL(svgBlob);

      img.onload = function () {
        ctx.fillStyle = "#0b1120";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URLObj.revokeObjectURL(blobURL);

        const a = document.createElement("a");
        a.download = "nexus_current_architecture_workflow.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      };

      img.src = blobURL;
    }
  </script>
